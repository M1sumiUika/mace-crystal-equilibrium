name: CPU logic tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ase==3.26.0" "numpy>=1.26,<3" "scipy>=1.13,<2" "matplotlib>=3.8,<4" "pytest>=8,<10"
          python -m pip install --no-deps -e .
      - name: Run geometry, units and synthetic EOS tests
        run: python -m pytest -m "not gpu" -q
